# iOS アプリ (Capacitor) が Xcode でビルドできるかを確認する。
# 署名なしの検証ビルドなので、実機へのインストールは手元の Mac で行う (docs/ios-app.md)。
name: iOS build check

on:
  push:
    paths:
      - "ios/**"
      - "plugins/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "capacitor.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for the app
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app (unsigned, device SDK)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
